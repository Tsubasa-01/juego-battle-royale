<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Free Survival Battle Royale 3D</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; user-select: none; -webkit-user-select: none;
      font-family: 'Arial Black', sans-serif, system-ui;
      background-color: #0d1117; color: #fff; touch-action: none;
    }

    #canvas-container {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
    }

    .ff-button {
      background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
      transition: all 0.2s ease; text-transform: uppercase; font-weight: 900;
      letter-spacing: 1px; cursor: pointer;
    }

    .ff-button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 85, 0, 0.7); }
    .ff-button:active { transform: scale(0.98); }

    .ff-panel {
      background: rgba(16, 22, 34, 0.85);
      border: 2px solid rgba(255, 153, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    .crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
    }

    .damage-indicator {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; box-shadow: inset 0 0 50px rgba(255,0,0,0);
      transition: box-shadow 0.1s ease; z-index: 15;
    }

    .damage-active { box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.8); }

    .hit-text {
      position: absolute; font-weight: 900; font-size: 20px; color: #ff0055;
      text-shadow: 1px 1px 2px black; pointer-events: none;
      animation: floatUp 0.8s ease-out forwards; z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
    }

    /* Joystick Táctil */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; z-index: 25; touch-action: none;
    }

    #joystick-knob {
      position: absolute; top: 35px; left: 35px;
      width: 50px; height: 50px; background: rgba(255, 153, 0, 0.8);
      border-radius: 50%; border: 2px solid #fff; pointer-events: none;
    }

    #touch-look-zone {
      position: absolute; top: 0; right: 0; width: 50%; height: 100%;
      z-index: 10; touch-action: none;
    }

    .action-btn {
      touch-action: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="damage-flash" class="damage-indicator"></div>
  <div id="canvas-container"></div>

  <!-- ================= LOBBY UI ================= -->
  <div id="lobby-ui" class="absolute inset-0 z-30 flex flex-col justify-between p-4 md:p-6 bg-gradient-to-r from-black/80 via-transparent to-black/80">
    <!-- Header -->
    <div class="flex justify-between items-center pointer-events-auto">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full border-2 border-yellow-500 bg-gray-800 flex items-center justify-center font-bold text-xl text-yellow-400">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <div class="font-extrabold text-lg tracking-wider text-yellow-400">HERO_PLAYER</div>
          <div class="text-xs text-gray-300 bg-black/50 px-2 py-0.5 rounded border border-gray-700">Nivel 42 | Rango: Heroico</div>
        </div>
      </div>

      <div class="flex gap-4 items-center">
        <div class="bg-black/60 px-3 py-1.5 rounded-lg border border-yellow-500/30 flex items-center gap-2">
          <i class="fa-solid fa-coins text-yellow-400"></i>
          <span class="font-bold text-sm">24,500</span>
        </div>
        <div class="bg-black/60 px-3 py-1.5 rounded-lg border border-cyan-500/30 flex items-center gap-2">
          <i class="fa-solid fa-gem text-cyan-400"></i>
          <span class="font-bold text-sm">1,250</span>
        </div>
      </div>
    </div>

    <!-- Selección de Personaje -->
    <div class="absolute right-6 top-1/4 flex flex-col gap-3 w-52 pointer-events-auto">
      <div class="text-xs uppercase text-gray-400 font-bold tracking-widest mb-1">Personaje</div>
      <button id="btn-kelly" onclick="selectChar('kelly')" class="ff-panel p-3 rounded-xl flex items-center gap-3 border-yellow-500 text-left cursor-pointer">
        <i class="fa-solid fa-bolt text-yellow-400 text-xl"></i>
        <div>
          <div class="font-bold text-sm">Kelly</div>
          <div class="text-[10px] text-gray-400">+15% Velocidad</div>
        </div>
      </button>
      <button id="btn-alok" onclick="selectChar('alok')" class="ff-panel p-3 rounded-xl flex items-center gap-3 border-transparent text-left opacity-70 cursor-pointer">
        <i class="fa-solid fa-wave-square text-cyan-400 text-xl"></i>
        <div>
          <div class="font-bold text-sm">Alok</div>
          <div class="text-[10px] text-gray-400">Aura Curativa (+HP)</div>
        </div>
      </button>
      <button id="btn-hayato" onclick="selectChar('hayato')" class="ff-panel p-3 rounded-xl flex items-center gap-3 border-transparent text-left opacity-70 cursor-pointer">
        <i class="fa-solid fa-shield-halved text-red-500 text-xl"></i>
        <div>
          <div class="font-bold text-sm">Hayato</div>
          <div class="text-[10px] text-gray-400">+Penetración</div>
        </div>
      </button>
    </div>

    <!-- Botón Iniciar -->
    <div class="flex justify-between items-end pointer-events-auto">
      <div class="ff-panel p-4 rounded-2xl w-64">
        <div class="text-xs text-yellow-400 font-extrabold uppercase mb-1">Modo Seleccionado</div>
        <div class="font-black text-xl flex items-center gap-2">
          <i class="fa-solid fa-skull-crossbones text-red-500"></i> BATTLE ROYALE
        </div>
        <div class="text-xs text-gray-400 mt-1">Bermuda 3D (Solo vs Bots)</div>
      </div>

      <button id="btn-start" onclick="startGame()" class="ff-button px-10 py-4 rounded-2xl text-2xl font-black text-black flex items-center gap-3">
        <i class="fa-solid fa-play"></i> INICIAR PARTIDA
      </button>
    </div>
  </div>

  <!-- ================= GAMEPLAY HUD UI ================= -->
  <div id="game-ui" class="hidden absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-4">
    
    <!-- Top Bar Info -->
    <div class="flex justify-between items-start">
      <div class="flex gap-2">
        <div class="bg-black/70 backdrop-blur border border-gray-700 px-4 py-2 rounded-xl flex items-center gap-3">
          <i class="fa-solid fa-users text-yellow-400"></i>
          <div>
            <div class="text-[10px] text-gray-400 uppercase font-bold">Vivos</div>
            <div id="hud-alive" class="font-black text-lg text-white">20</div>
          </div>
        </div>
        <div class="bg-black/70 backdrop-blur border border-gray-700 px-4 py-2 rounded-xl flex items-center gap-3">
          <i class="fa-solid fa-crosshairs text-red-500"></i>
          <div>
            <div class="text-[10px] text-gray-400 uppercase font-bold">Kills</div>
            <div id="hud-kills" class="font-black text-lg text-white">0</div>
          </div>
        </div>
      </div>

      <div class="flex flex-col items-end gap-2">
        <div id="zone-timer" class="bg-red-600/80 text-white text-xs font-black px-3 py-1 rounded-full border border-red-400">
          Zona: <span id="timer-sec">30</span>s
        </div>
        
        <div class="w-28 h-28 bg-black/80 rounded-full border-2 border-yellow-500/50 overflow-hidden relative shadow-lg">
          <canvas id="minimap" class="w-full h-full"></canvas>
        </div>
      </div>
    </div>

    <!-- Center Crosshair -->
    <div class="crosshair">
      <div class="w-4 h-4 relative flex items-center justify-center">
        <div class="w-1.5 h-1.5 bg-red-500 rounded-full"></div>
        <div class="absolute w-3 h-0.5 bg-green-400 -left-2"></div>
        <div class="absolute w-3 h-0.5 bg-green-400 -right-2"></div>
        <div class="absolute h-3 w-0.5 bg-green-400 -top-2"></div>
        <div class="absolute h-3 w-0.5 bg-green-400 -bottom-2"></div>
      </div>
    </div>

    <!-- Joystick Táctil y Zona Mover Vista -->
    <div id="joystick-zone" class="pointer-events-auto">
      <div id="joystick-knob"></div>
    </div>
    <div id="touch-look-zone" class="pointer-events-auto"></div>

    <!-- Botón Recoger Loot Pop-up -->
    <div id="loot-pickup-prompt" class="hidden absolute top-2/3 left-1/2 transform -translate-x-1/2 pointer-events-auto">
      <button onclick="pickupLootNear()" class="bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold px-6 py-2 rounded-full border-2 border-white shadow-lg flex items-center gap-2">
        <i class="fa-solid fa-hand"></i> RECOGER <span id="loot-item-name">ARMA</span>
      </button>
    </div>

    <!-- Bottom Controls & Status Bar -->
    <div class="flex justify-between items-end w-full">
      
      <!-- Health & Medkit -->
      <div class="w-64 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <button onclick="useMedkit()" class="pointer-events-auto bg-green-600 active:scale-95 text-white p-3 rounded-xl flex items-center justify-center shadow-lg border border-green-400">
            <i class="fa-solid fa-kit-medical text-2xl"></i>
            <span id="hud-medkits" class="ml-1 bg-black/60 text-xs px-2 py-0.5 rounded-full">3</span>
          </button>
          
          <button onclick="placeGlooWall()" class="pointer-events-auto bg-cyan-600 active:scale-95 text-white p-3 rounded-xl flex items-center justify-center shadow-lg border border-cyan-400">
            <i class="fa-solid fa-shield text-xl"></i>
            <span id="hud-gloos" class="ml-1 bg-black/60 text-xs px-2 py-0.5 rounded-full">3</span>
          </button>

          <div class="flex-1 bg-black/70 p-2 rounded-xl border border-gray-700">
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-green-400 flex items-center gap-1"><i class="fa-solid fa-heart"></i> HP</span>
              <span id="hud-hp-text">100 / 100</span>
            </div>
            <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden border border-gray-600">
              <div id="hud-hp-bar" class="bg-gradient-to-r from-green-500 to-emerald-300 h-full w-full transition-all duration-200"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Selector de Armas -->
      <div class="pointer-events-auto flex gap-2">
        <div id="wpn-ak" onclick="switchWeapon('AK47')" class="bg-black/80 border-2 border-yellow-500 p-2 rounded-xl text-center w-24 cursor-pointer shadow-lg">
          <div class="text-[9px] text-yellow-400 font-bold">Rifle</div>
          <div class="font-black text-xs text-white">AK-47</div>
        </div>
        <div id="wpn-mp40" onclick="switchWeapon('MP40')" class="bg-black/60 border border-gray-700 p-2 rounded-xl text-center w-24 cursor-pointer opacity-60">
          <div class="text-[9px] text-cyan-400 font-bold">Subfusil</div>
          <div class="font-black text-xs text-white">MP40</div>
        </div>
      </div>

      <!-- Action Shoot Buttons (Táctil) -->
      <div class="pointer-events-auto flex gap-3 items-center">
        <button id="btn-touch-shoot" class="action-btn w-20 h-20 bg-red-600 rounded-full border-4 border-white/50 flex items-center justify-center active:bg-red-700 text-white shadow-xl">
          <i class="fa-solid fa-crosshairs text-3xl"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- ================= GAME OVER / BOOYAH SCREEN ================= -->
  <div id="end-screen" class="hidden absolute inset-0 z-40 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div id="end-title" class="text-6xl font-black italic tracking-wider mb-2 text-yellow-400 drop-shadow-[0_5px_15px_rgba(234,179,8,0.6)]">
      BOOYAH!
    </div>
    <p id="end-subtitle" class="text-gray-300 text-lg mb-6">¡Has dominado el campo de batalla!</p>

    <div class="ff-panel p-6 rounded-2xl w-80 mb-8 border-yellow-500/50">
      <div class="flex justify-between py-2 border-b border-gray-700">
        <span class="text-gray-400">Posición</span>
        <span id="end-rank" class="font-bold text-yellow-400">#1</span>
      </div>
      <div class="flex justify-between py-2 border-b border-gray-700">
        <span class="text-gray-400">Kills</span>
        <span id="end-kills" class="font-bold text-red-400">0</span>
      </div>
    </div>

    <button onclick="backToLobby()" class="ff-button px-8 py-4 rounded-xl text-xl text-black">
      VOLVER AL LOBBY
    </button>
  </div>


  <!-- ================= JAVASCRIPT GAME LOGIC ================= -->
  <script>
    let scene, camera, renderer;
    let player, playerBody;
    let bots = [];
    let lootItems = [];
    let bullets = [];
    let obstacleColliders = []; // Cajas de colisión para físicas

    let playerStats = {
      hp: 100, maxHp: 100, medkits: 3, glooWalls: 3,
      speed: 0.35, kills: 0, character: 'kelly', activeWeapon: 'AK47'
    };

    const weaponsData = {
      'AK47': { damage: 28, cadence: 140, range: 120 },
      'MP40': { damage: 18, cadence: 80, range: 70 },
      'M1887': { damage: 65, cadence: 450, range: 40 }
    };

    let lastShotTime = 0;
    let aliveCount = 20;
    let gameActive = false;
    let keys = {};

    let joystickData = { active: false, moveX: 0, moveY: 0 };
    let touchLookData = { active: false, lastX: 0, lastY: 0 };

    let safeZone = { radius: 180, x: 0, z: 0, shrinkSpeed: 0.03, mesh: null };
    let zoneTimer = 30, zoneInterval;
    let yaw = 0, pitch = 0;

    function initEngine() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      setupTouchControls();
      setupKeyboardControls();
      animate();
    }

    /* --- MAPA Y OBSTÁCULOS CON COLISIONES --- */
    function createMap() {
      obstacleColliders = [];

      // Terreno
      const terrainGeo = new THREE.PlaneGeometry(400, 400, 32, 32);
      terrainGeo.rotateX(-Math.PI / 2);
      const terrainMat = new THREE.MeshStandardMaterial({ color: 0x4e8752, roughness: 0.9 });
      const terrain = new THREE.Mesh(terrainGeo, terrainMat);
      terrain.receiveShadow = true;
      scene.add(terrain);

      // Casas y Coberturas
      for (let i = 0; i < 18; i++) {
        let cx = (Math.random() - 0.5) * 280;
        let cz = (Math.random() - 0.5) * 280;
        createHouse(cx, cz);
      }

      // Árboles y Rocas
      for (let i = 0; i < 100; i++) {
        let tx = (Math.random() - 0.5) * 320;
        let tz = (Math.random() - 0.5) * 320;
        if (Math.random() > 0.3) createTree(tx, tz);
        else createRock(tx, tz);
      }

      // Zona Segura
      const zoneGeo = new THREE.CylinderGeometry(safeZone.radius, safeZone.radius, 100, 32, 1, true);
      const zoneMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
      safeZone.mesh = new THREE.Mesh(zoneGeo, zoneMat);
      safeZone.mesh.position.set(0, 50, 0);
      scene.add(safeZone.mesh);
    }

    function createHouse(x, z) {
      const group = new THREE.Group();
      
      const bodyGeo = new THREE.BoxGeometry(12, 8, 12);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb5aa9d });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 4;
      group.add(body);

      const roofGeo = new THREE.ConeGeometry(10, 5, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0xaa3333 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 10.5;
      roof.rotation.y = Math.PI / 4;
      group.add(roof);

      group.position.set(x, 0, z);
      scene.add(group);

      // Agregar a Colisionadores
      obstacleColliders.push(new THREE.Box3().setFromObject(body));
    }

    function createTree(x, z) {
      const group = new THREE.Group();
      const trunkGeo = new THREE.CylinderGeometry(0.6, 0.8, 5);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 2.5;
      group.add(trunk);

      const leavesGeo = new THREE.ConeGeometry(3.5, 8, 5);
      const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40 });
      const leaves = new THREE.Mesh(leavesGeo, leavesMat);
      leaves.position.y = 7;
      group.add(leaves);

      group.position.set(x, 0, z);
      scene.add(group);

      obstacleColliders.push(new THREE.Box3().setFromObject(trunk));
    }

    function createRock(x, z) {
      const geo = new THREE.DodecahedronGeometry(2, 1);
      const mat = new THREE.MeshStandardMaterial({ color: 0x666666 });
      const rock = new THREE.Mesh(geo, mat);
      rock.position.set(x, 1, z);
      scene.add(rock);

      obstacleColliders.push(new THREE.Box3().setFromObject(rock));
    }

    function placeGlooWall() {
      if (playerStats.glooWalls <= 0 || !gameActive) return;
      playerStats.glooWalls--;
      document.getElementById('hud-gloos').innerText = playerStats.glooWalls;

      const wallGeo = new THREE.BoxGeometry(7, 4, 0.8);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x00d8ff, transparent: true, opacity: 0.8 });
      const gloo = new THREE.Mesh(wallGeo, wallMat);

      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
      gloo.position.copy(player.position).addScaledVector(dir, 4);
      gloo.position.y = 2;
      gloo.rotation.y = player.rotation.y;

      scene.add(gloo);
      obstacleColliders.push(new THREE.Box3().setFromObject(gloo));
    }

    /* --- JUGADOR Y BOTS --- */
    function createCharacterMesh(colorHex) {
      const group = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.6, 0.4, 2);
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.5;
      group.add(body);

      const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.8;
      group.add(head);

      const gunGeo = new THREE.BoxGeometry(0.2, 0.3, 1.2);
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const gun = new THREE.Mesh(gunGeo, gunMat);
      gun.position.set(0.5, 1.8, -0.4);
      group.add(gun);

      return group;
    }

    function spawnPlayer() {
      player = new THREE.Group();
      playerBody = createCharacterMesh(0xffaa00);
      player.add(playerBody);
      player.position.set(0, 0, 0);
      scene.add(player);
    }

    function spawnBots() {
      bots = [];
      for (let i = 0; i < 19; i++) {
        const botMesh = createCharacterMesh(0xd13434);
        const bx = (Math.random() - 0.5) * 280;
        const bz = (Math.random() - 0.5) * 280;
        botMesh.position.set(bx, 0, bz);

        const botObj = {
          mesh: botMesh, hp: 100, targetX: bx, targetZ: bz, lastShoot: 0, speed: 0.15
        };
        scene.add(botMesh);
        bots.push(botObj);
      }
    }

    function spawnLoot() {
      lootItems.forEach(i => scene.remove(i.mesh));
      lootItems = [];

      const weaponsList = ['AK47', 'MP40', 'M1887'];
      for (let i = 0; i < 25; i++) {
        const wpn = weaponsList[Math.floor(Math.random() * weaponsList.length)];
        const geo = new THREE.BoxGeometry(0.8, 0.3, 1.5);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x332200 });
        const mesh = new THREE.Mesh(geo, mat);

        const lx = (Math.random() - 0.5) * 300;
        const lz = (Math.random() - 0.5) * 300;
        mesh.position.set(lx, 0.5, lz);
        scene.add(mesh);

        lootItems.push({ mesh, weapon: wpn, x: lx, z: lz });
      }
    }

    /* --- COLISIONES Y MOVIMIENTO --- */
    function checkCollision(newPos) {
      const playerBox = new THREE.Box3();
      const radius = 0.6;
      playerBox.min.set(newPos.x - radius, 0, newPos.z - radius);
      playerBox.max.set(newPos.x + radius, 3, newPos.z + radius);

      for (let collider of obstacleColliders) {
        if (playerBox.intersectsBox(collider)) return true;
      }
      return false;
    }

    function updatePlayerMovement() {
      let moveDir = new THREE.Vector3();

      // Teclado
      if (keys['KeyW']) moveDir.z -= 1;
      if (keys['KeyS']) moveDir.z += 1;
      if (keys['KeyA']) moveDir.x -= 1;
      if (keys['KeyD']) moveDir.x += 1;

      // Joystick Táctil
      if (joystickData.active) {
        moveDir.x = joystickData.moveX;
        moveDir.z = joystickData.moveY;
      }

      if (moveDir.length() > 0) {
        moveDir.normalize();
        player.rotation.y = yaw;
        moveDir.applyQuaternion(player.quaternion);

        const nextPos = player.position.clone().addScaledVector(moveDir, playerStats.speed);
        
        // Verificar Colisión antes de avanzar
        if (!checkCollision(nextPos)) {
          player.position.copy(nextPos);
        }
      }

      // Cámara Tercera Persona
      const cameraOffset = new THREE.Vector3(0, 3.5, 6).applyQuaternion(player.quaternion);
      camera.position.copy(player.position).add(cameraOffset);
      camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
    }

    /* --- SISTEMA DE DISPARO Y BALAS --- */
    function shootWeapon(shooterGroup, isPlayer = false) {
      const now = Date.now();
      const wpn = weaponsData[playerStats.activeWeapon];
      if (isPlayer && now - lastShotTime < wpn.cadence) return;
      if (isPlayer) lastShotTime = now;

      const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
      const bulletMat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff3300 });
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);

      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(shooterGroup.quaternion);
      bullet.position.copy(shooterGroup.position).add(new THREE.Vector3(0, 1.8, 0));

      bullets.push({
        mesh: bullet, direction: dir, speed: 3.5, distance: 0,
        maxRange: wpn.range, isPlayer: isPlayer, damage: wpn.damage
      });
      scene.add(bullet);
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.mesh.position.addScaledVector(b.direction, b.speed);
        b.distance += b.speed;

        // Choque con Obstáculos
        const bulletBox = new THREE.Box3().setFromObject(b.mesh);
        let hitWall = false;
        for (let col of obstacleColliders) {
          if (bulletBox.intersectsBox(col)) { hitWall = true; break; }
        }

        if (hitWall) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
          continue;
        }

        if (b.isPlayer) {
          for (let j = bots.length - 1; j >= 0; j--) {
            const bot = bots[j];
            if (b.mesh.position.distanceTo(bot.mesh.position) < 1.5) {
              bot.hp -= b.damage;
              showHitText(b.damage, b.mesh.position);
              scene.remove(b.mesh);
              bullets.splice(i, 1);

              if (bot.hp <= 0) {
                scene.remove(bot.mesh);
                bots.splice(j, 1);
                playerStats.kills++;
                aliveCount--;
                updateHUD();
                checkWinCondition();
              }
              break;
            }
          }
        } else {
          if (b.mesh.position.distanceTo(player.position) < 1.5) {
            damagePlayer(b.damage);
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            continue;
          }
        }

        if (b.distance >= b.maxRange) {
          scene.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }
    }

    /* --- IA BOTS --- */
    function updateBots() {
      const now = Date.now();
      bots.forEach(bot => {
        const distToPlayer = bot.mesh.position.distanceTo(player.position);
        if (distToPlayer < 40) {
          bot.mesh.lookAt(player.position.x, bot.mesh.position.y, player.position.z);
          if (distToPlayer > 8) {
            const nextBotPos = bot.mesh.position.clone().addScaledVector(
              new THREE.Vector3(0,0,-1).applyQuaternion(bot.mesh.quaternion), bot.speed
            );
            if (!checkCollision(nextBotPos)) bot.mesh.position.copy(nextBotPos);
          }
          if (now - bot.lastShoot > 1200) {
            shootWeapon(bot.mesh, false);
            bot.lastShoot = now;
          }
        }
      });
    }

    /* --- RECOGER ARMAS DEL SUELO --- */
    function checkLootPickup() {
      let foundLoot = null;
      for (let i = 0; i < lootItems.length; i++) {
        const item = lootItems[i];
        item.mesh.rotation.y += 0.03;
        if (player.position.distanceTo(item.mesh.position) < 3.0) {
          foundLoot = item;
          break;
        }
      }

      const prompt = document.getElementById('loot-pickup-prompt');
      if (foundLoot) {
        prompt.classList.remove('hidden');
        document.getElementById('loot-item-name').innerText = foundLoot.weapon;
        prompt.dataset.lootIndex = lootItems.indexOf(foundLoot);
      } else {
        prompt.classList.add('hidden');
      }
    }

    function pickupLootNear() {
      const prompt = document.getElementById('loot-pickup-prompt');
      const idx = prompt.dataset.lootIndex;
      if (idx !== undefined && lootItems[idx]) {
        const item = lootItems[idx];
        switchWeapon(item.weapon);
        scene.remove(item.mesh);
        lootItems.splice(idx, 1);
        prompt.classList.add('hidden');
      }
    }

    /* --- CONTROLES TÁCTILES --- */
    function setupTouchControls() {
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      const lookZone = document.getElementById('touch-look-zone');

      zone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        joystickData.active = true;
      });

      zone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!joystickData.active) return;
        const touch = e.touches[0];
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 45;

        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }

        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickData.moveX = dx / maxDist;
        joystickData.moveY = dy / maxDist;
      });

      const resetJoystick = () => {
        joystickData.active = false;
        joystickData.moveX = 0; joystickData.moveY = 0;
        knob.style.transform = `translate(0px, 0px)`;
      };

      zone.addEventListener('touchend', resetJoystick);
      zone.addEventListener('touchcancel', resetJoystick);

      // Rotación de Cámara con Pantalla Derecha
      lookZone.addEventListener('touchstart', (e) => {
        touchLookData.active = true;
        touchLookData.lastX = e.touches[0].clientX;
        touchLookData.lastY = e.touches[0].clientY;
      });

      lookZone.addEventListener('touchmove', (e) => {
        if (!touchLookData.active) return;
        const touch = e.touches[0];
        const dx = touch.clientX - touchLookData.lastX;
        yaw -= dx * 0.005;
        touchLookData.lastX = touch.clientX;
      });

      lookZone.addEventListener('touchend', () => touchLookData.active = false);

      // Botón de Disparo
      document.getElementById('btn-touch-shoot').addEventListener('touchstart', (e) => {
        e.preventDefault();
        shootWeapon(player, true);
      });
    }

    function setupKeyboardControls() {
      window.addEventListener('keydown', (e) => keys[e.code] = true);
      window.addEventListener('keyup', (e) => keys[e.code] = false);
    }

    /* --- HUD Y ESTADOS --- */
    function damagePlayer(amount) {
      playerStats.hp = Math.max(0, playerStats.hp - amount);
      updateHUD();
      const flash = document.getElementById('damage-flash');
      flash.classList.add('damage-active');
      setTimeout(() => flash.classList.remove('damage-active'), 150);
      if (playerStats.hp <= 0 && gameActive) endGame(false);
    }

    function updateHUD() {
      document.getElementById('hud-hp-text').innerText = `${Math.round(playerStats.hp)} / ${playerStats.maxHp}`;
      document.getElementById('hud-hp-bar').style.width = `${(playerStats.hp / playerStats.maxHp) * 100}%`;
      document.getElementById('hud-medkits').innerText = playerStats.medkits;
      document.getElementById('hud-kills').innerText = playerStats.kills;
      document.getElementById('hud-alive').innerText = aliveCount;
    }

    function showHitText(damage, position) {
      const el = document.createElement('div');
      el.className = 'hit-text';
      el.innerText = `-${damage}`;
      const vector = position.clone().project(camera);
      const x = (vector.x * .5 + .5) * window.innerWidth;
      const y = (-(vector.y * .5) + .5) * window.innerHeight;
      el.style.left = `${x}px`; el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function switchWeapon(wpnKey) {
      playerStats.activeWeapon = wpnKey;
    }

    function useMedkit() {
      if (playerStats.medkits > 0 && playerStats.hp < playerStats.maxHp) {
        playerStats.medkits--;
        playerStats.hp = Math.min(100, playerStats.hp + 50);
        updateHUD();
      }
    }

    function selectChar(c) {
      playerStats.character = c;
      playerStats.speed = c === 'kelly' ? 0.42 : 0.35;
    }

    function animate() {
      requestAnimationFrame(animate);
      if (gameActive) {
        updatePlayerMovement();
        updateBullets();
        updateBots();
        checkLootPickup();
      }
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function startGame() {
      document.getElementById('lobby-ui').classList.add('hidden');
      document.getElementById('game-ui').classList.remove('hidden');

      playerStats.hp = 100; playerStats.kills = 0; aliveCount = 20;
      
      while(scene.children.length > 0) scene.remove(scene.children[0]);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(100, 150, 50);
      scene.add(dirLight);

      createMap();
      spawnPlayer();
      spawnBots();
      spawnLoot();

      updateHUD();
      gameActive = true;
    }

    function checkWinCondition() {
      if (aliveCount <= 1) endGame(true);
    }

    function endGame(isWin) {
      gameActive = false;
      document.getElementById('game-ui').classList.add('hidden');
      document.getElementById('end-screen').classList.remove('hidden');
      document.getElementById('end-title').innerText = isWin ? "BOOYAH!" : "ELIMINADO";
      document.getElementById('end-kills').innerText = playerStats.kills;
    }

    function backToLobby() {
      document.getElementById('end-screen').classList.add('hidden');
      document.getElementById('lobby-ui').classList.remove('hidden');
    }

    window.onload = () => {
      initEngine();
      createMap();
      spawnPlayer();
    };
  </script>
</body>
</html>
